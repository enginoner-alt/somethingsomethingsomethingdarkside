name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 5s
          --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: server
    env:
      TEST_DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/pyproject.toml
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  stack:
    # Builds the real images, starts the db + app stacks exactly like
    # ./darkside up does on a laptop, and verifies the network isolation rules.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose files
        run: |
          cp .env.example .env
          for s in db app asr; do
            docker compose -p "ci-$s" --env-file .env -f "deploy/$s/compose.yml" config --quiet
          done
      - name: Configure for CI
        run: |
          sed -i "s/^SITE_ADDRESS=.*/SITE_ADDRESS=localhost/; s#^CADDY_TLS=.*#CADDY_TLS=internal#" .env
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$(openssl rand -hex 24)/" .env
          sed -i "s/^SECRET_KEY=.*/SECRET_KEY=$(openssl rand -hex 32)/" .env
          sed -i "s/^BOOTSTRAP_ADMIN_PASSWORD=.*/BOOTSTRAP_ADMIN_PASSWORD=ci-admin-password/" .env
      - name: Build images and start stacks
        run: |
          ./darkside db build
          ./darkside up --build
      - name: Isolation check
        run: ./darkside check
      - name: Login through caddy
        run: |
          code=$(curl -sk -o /dev/null -w '%{http_code}' https://localhost/login)
          test "$code" = 200 || { echo "login page returned $code"; exit 1; }
      - name: Logs on failure
        if: failure()
        run: ./darkside logs || true

  recorder:
    # The recorder in a real browser with a fake microphone (tone markers),
    # against the real app + Postgres. Local accounts here (no AD in CI);
    # the same script runs against Samba AD in dev/ad-test.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 5s
          --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/test
      SECRET_KEY: ci-recorder-secret-key-0123456789abcdef0123
      SESSION_COOKIE_SECURE: "false"
      BOOTSTRAP_ADMIN_PASSWORD: ci-admin-password
      TEST_ACCOUNT_PASSWORD: ci-test-password
      AUDIO_DIR: /tmp/darkside-audio
      RECORDER_CHUNK_SECONDS: "1"
      RECORDING_STALE_SECONDS: "5"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pip install -e "./server" numpy
      - run: npm install --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
      - name: Start the app
        working-directory: server
        run: |
          mkdir -p "$AUDIO_DIR"
          alembic upgrade head
          python -m app.bootstrap
          nohup uvicorn app.main:create_app --factory --port 8000 > /tmp/app.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8000/healthz && break; sleep 1; done
      - name: Recorder e2e
        run: |
          python dev/recorder-test/markers.py make /tmp/markers.wav
          APP_URL=http://localhost:8000 MARKERS_WAV=/tmp/markers.wav OUT=/tmp/rec-out PYTHON=python \
          LOGIN_USER=test LOGIN_PASSWORD=ci-test-password \
          OTHER_USER=admin OTHER_PASSWORD=ci-admin-password \
          node dev/recorder-test/e2e_recorder.cjs
      - name: M3 e2e (fake WhisperX + fake LLM, real workers)
        run: |
          (cd dev/fakes && nohup uvicorn --app-dir . fake_whisperx:app --port 19000 > /tmp/fw.log 2>&1 &)
          (cd dev/fakes && FAKE_LLM_KEY=sk-ci nohup uvicorn --app-dir . fake_llm:app --port 18000 > /tmp/fl.log 2>&1 &)
          mkdir -p /tmp/ci-secrets/llm && printf 'sk-ci' > /tmp/ci-secrets/llm/llm_api_key
          cd server
          (SECRETS_DIR=/tmp/ci-secrets WORKER_ID=worker-asr-1 nohup python -m app.worker --queue gpu > /tmp/wasr.log 2>&1 &)
          (SECRETS_DIR=/tmp/ci-secrets WORKER_ID=worker-llm-1 nohup python -m app.worker --queue llm > /tmp/wllm.log 2>&1 &)
          # The app keeps running from the recorder step; only the workers need the LLM key.
          python - <<'PY'
          import re, httpx
          c = httpx.Client(base_url="http://localhost:8000", follow_redirects=False, timeout=30)
          tok = lambda p: re.search(r'name="csrf" value="([^"]+)"', c.get(p).text).group(1)
          c.post("/login", data={"username": "admin", "password": "ci-admin-password", "csrf": tok("/login")})
          r = c.post("/admin/services", data={"csrf": tok("/admin/services"), "asr_url": "http://127.0.0.1:19000",
              "auto_transcribe": "on", "asr_language": "tr", "asr_diarize": "on", "default_channel": "mix",
              "llm_base_url": "http://127.0.0.1:18000/v1", "llm_model": "fake-model"})
          assert r.status_code == 303, r.text
          PY
          cd ..
          APP_URL=http://localhost:8000 AUDIO=dev/test-audio/four-channel-tones.wav \
          LOGIN_USER=test LOGIN_PASSWORD=ci-test-password node dev/m3-test/e2e_m3.cjs
      - name: App log on failure
        if: failure()
        run: cat /tmp/app.log /tmp/wasr.log /tmp/wllm.log 2>/dev/null || true
