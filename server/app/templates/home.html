{% extends "base.html" %}
{% block title %}{{ t("rec.title") }} · {{ app_name }}{% endblock %}
{% block content %}
<div id="list-app" data-csrf="{{ csrf_token }}" data-locale="{{ locale }}" data-i18n='{{ js_strings | tojson }}'>
  <div class="page-head">
    <div>
      <h1>{{ t("rec.title") }}</h1>
      <p class="lede">{{ t("rec.list_lede") }}</p>
    </div>
    <a class="button primary" href="/record"><span class="dot" aria-hidden="true"></span>{{ t("rec.new") }}</a>
  </div>

  <div class="toolbar">
    <label class="sr-only" for="rec-search">{{ t("rec.search") }}</label>
    <input type="search" id="rec-search" placeholder="{{ t('rec.search') }}" autocomplete="off">
    <span class="grow"></span>
    <details class="upload-box">
      <summary>{{ t("rec.upload") }}</summary>
      <form id="upload-form" class="stack panel">
        <p class="notice">{{ cfg.consent_notice }}</p>
        <label class="check"><input type="checkbox" id="consent"> {{ t("rec.consent") }}</label>
        <input type="file" id="upload-file" accept="audio/*,.webm,.ogg,.opus,.m4a,.mp3,.wav,.flac,.aac" required>
        <div class="row"><button class="primary">{{ t("rec.upload_button") }}</button><span id="upload-status" class="muted small" role="status"></span></div>
      </form>
    </details>
  </div>

  <div id="rec-list" class="rec-list"><p class="muted empty">{{ t("rec.loading") }}</p></div>
</div>
<script src="/static/common.js" defer></script>
<script src="/static/list.js" defer></script>
{% endblock %}
